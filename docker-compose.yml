services:
  stubs:
    build: .
    command: npx tsx services/stubs/src/index.ts
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build: .
    command: npx tsx services/collector/src/index.ts
    environment:
      SKLUM_DB: /data/events.sqlite
    volumes:
      - events:/data
    ports: ["4200:4200"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build: .
    command: npx tsx services/bff/src/index.ts
    environment:
      CORE_BASE_URL: http://stubs:4000
      COLLECTOR_URL: http://collector:4200
    ports: ["4100:4100"]
    depends_on:
      stubs: { condition: service_healthy }
      collector: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  events:
