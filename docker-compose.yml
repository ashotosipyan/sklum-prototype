services:
  stubs:
    build: .
    command: npx tsx services/stubs/src/index.ts
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/_control"]
      interval: 5s
      timeout: 3s
      retries: 5

  bff:
    build: .
    command: npx tsx services/bff/src/index.ts
    environment:
      # Inside the compose network the stubs are reachable by service name.
      CORE_BASE_URL: http://stubs:4000
    ports:
      - "4100:4100"
    depends_on:
      stubs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 5
